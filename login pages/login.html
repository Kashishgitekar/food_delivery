<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Delivery — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="scene">

        <!-- floating background food -->
        <span class="drift drift--pizza" aria-hidden="true">🍕</span>
        <span class="drift drift--noodles" aria-hidden="true">🍜</span>
        <span class="drift drift--burger" aria-hidden="true">🍔</span>
        <span class="drift drift--sushi" aria-hidden="true">🍣</span>
        <span class="drift drift--donut" aria-hidden="true">🍩</span>

        <!-- scooter delivery animation -->
        <div class="scooter" aria-hidden="true">🛵</div>

        <form id="form" class="card" action="form">

            <div class="steam" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>

            <h1>Login</h1>
            <p class="tagline">Hot meals, cool delivery.</p>

            <div class="field">
                <i class="ri-user-fill field-icon"></i>
                <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required>
                <label for="username">Username</label>
            </div>

            <div class="field">
                <i class="ri-lock-password-fill field-icon"></i>
                <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn">
                <span class="btn-text">Log in</span>
            </button>

            <a href="signup.html" class="signup-link">New here? <span>Create an account</span></a>

        </form>
    </div>

<script src="login.js"></script>
</body>
</html>
