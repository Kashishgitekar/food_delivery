<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Delivery — Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="scene">

        <!-- floating background food -->
        <span class="drift drift--pizza" aria-hidden="true">🍕</span>
        <span class="drift drift--noodles" aria-hidden="true">🍜</span>
        <span class="drift drift--burger" aria-hidden="true">🍔</span>
        <span class="drift drift--sushi" aria-hidden="true">🍣</span>
        <span class="drift drift--donut" aria-hidden="true">🍩</span>

        <!-- scooter delivery animation -->
        <div class="scooter" aria-hidden="true">🛵</div>

        <form id="form" class="card" action="signup">

            <div class="steam" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>

            <h1>Sign Up</h1>
            <p class="tagline">Join in, your first order's waiting.</p>

            <div class="field">
                <i class="ri-user-fill field-icon"></i>
                <input type="text" id="fullname" name="fullname" placeholder=" " autocomplete="name" required>
                <label for="fullname">Full name</label>
            </div>

            <div class="field">
                <i class="ri-mail-fill field-icon"></i>
                <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                <label for="email">Email</label>
            </div>

            <div class="field">
                <i class="ri-lock-password-fill field-icon"></i>
                <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required>
                <label for="password">Password</label>
            </div>

            <div class="field">
                <i class="ri-lock-2-fill field-icon"></i>
                <input type="password" id="confirm-password" name="confirm-password" placeholder=" " autocomplete="new-password" required>
                <label for="confirm-password">Confirm password</label>
            </div>

            <button type="submit" class="btn">
                <span class="btn-text">Create account</span>
            </button>

            <a href="login.html" class="signup-link">Already have an account? <span>Log in</span></a>

        </form>
    </div>
<script src="register.js"></script>
</body>
</html>
